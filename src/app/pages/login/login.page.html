<div class="login-container">
  <!-- Encabezado: logo + título -->
  <div class="brand-header" aria-label="Inicio de sesión LaMorada">
    <img
      class="brand-logo"
      src="assets/logos/lamorada.png"
      alt="LaMorada"
      width="96"
      height="96"
      loading="eager"
      decoding="async"
    />
    <h2 class="brand-title">Iniciar Sesión</h2>
  </div>

  <form (ngSubmit)="login()">
    <input [(ngModel)]="username" name="username" type="email" placeholder="Correo electrónico" required />
    <input [(ngModel)]="password" name="password" type="password" placeholder="Contraseña" required />

    <button type="submit" class="primary-btn">Ingresar</button>
  </form>

  <a routerLink="/register" class="alt-link">¿No tienes cuenta? Regístrate</a>
</div>

<!-- ===== Modal (mismo estilo LaMorada) ===== -->
<div class="modal-backdrop" *ngIf="showModal" (click)="closeModal()" aria-hidden="true"></div>

<div class="modal" *ngIf="showModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-header">
    <div class="modal-icon" aria-hidden="true">!</div>
    <h3 id="modalTitle">Atención</h3>
  </div>

  <div class="modal-body">
    <p>{{ modalMessage }}</p>
  </div>

  <div class="modal-actions">
    <button type="button" class="modal-btn" (click)="closeModal()">Entendido</button>
  </div>
</div>
